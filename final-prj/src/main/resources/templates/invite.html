<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body style="margin:0;padding:30px 0;background-color:#f5f7f9;"> 
<div style=" width:100%; max-width:680px; margin:0 auto; background-color:#ffffff; border:1px solid #e1e5e9; border-radius:16px; overflow:hidden; font-family:Arial,'Noto Sans KR',sans-serif; color:#222222; box-sizing:border-box; "> 
<!-- Header --> 
<div style=" padding:30px 34px; background-color:#263238; color:#ffffff; "> 
<div style=" margin:0 0 7px; font-size:13px; font-weight:700; letter-spacing:1px; color:#b0bec5; "> 
MEMBER INVITATION </div> 
<div style=" margin:0; font-size:25px; line-height:1.4; font-weight:700; "> 회원가입 초대 안내 </div> 
</div> 
<!-- Content --> 
<div style="padding:34px;"> 
<!-- Welcome --> 
<div style=" margin:0 0 26px; font-size:16px; line-height:1.8; color:#455a64; ">
 안녕하세요.<br> 회원가입 초대를 받으셨습니다.<br> 아래의 초대 링크를 통해 회원가입을 진행해 주세요. 
</div> 
<!-- Invitation Link --> 
<div style=" margin:0 0 28px; padding:24px 12px; background-color:#f6f8fa; border:1px solid #dce2e7; border-radius:12px; text-align:center; box-sizing:border-box; "> 
<div style=" margin:0 0 15px; font-size:13px; line-height:1.6; color:#78909c; "> 
아래 버튼을 클릭하여 회원가입을 진행해 주세요. </div>
 <a class="invite-link" href="${inviteUrl}" style=" display:inline-block; padding:14px 32px; background-color:#263238; color:#ffffff; text-decoration:none; border-radius:8px; font-size:15px; font-weight:700; "> 
회원가입 하러가기 </a> </div> 
<!-- Temporary Password --> 
<div style=" margin:0 0 28px; padding:24px 12px; background-color:#fff8e1; border:1px solid #ffe082; border-radius:12px; text-align:center; box-sizing:border-box; "> 
<div style=" margin:0 0 8px; font-size:13px; line-height:1.6; color:#8d6e63; ">
 임시 비밀번호 </div> 
<div style=" margin:0 auto; max-width:480px; padding:14px 18px; background-color:#ffffff; border:2px solid #546e7a; border-radius:8px; box-sizing:border-box; font-family:Consolas,Monaco,'Courier New',monospace; font-size:22px; line-height:26px; font-weight:700; letter-spacing:4px; text-align:center; color:#263238; word-break:break-all; ">
 <span class="password-text">
 ${tempPassword} 
 </span>
 </div> 
<div style=" margin:15px 0 0; font-size:13px; line-height:1.6; color:#795548; ">
 임시 비밀번호를 이용하여 로그인해 주세요. </div> </div>
 <!-- Warning --> 
<div style=" margin:0 0 26px; padding:15px 17px; background-color:#fff8e1; border-left:5px solid #ffb300; border-radius:7px; font-size:15px; line-height:1.7; color:#5d4037; "> 
임시 비밀번호가 다른 사람에게 노출되지 않도록 주의하시기 바랍니다. </div> 
<!-- Guide -->
 <div style=" margin:30px 0; border-top:1px solid #e1e5e9; "></div> 
<div style=" margin:0; font-size:14px; line-height:1.8; color:#78909c; ">
 회원가입 및 로그인 후 반드시 새로운 비밀번호로 변경해 주세요.
<br> 본인이 요청하지 않은 회원가입 초대라면 관리자에게 문의하시기 바랍니다. </div>
 </div> 
</div>
 </body>
</html>
